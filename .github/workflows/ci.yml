name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  auth-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students-app-auth-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B test

  resource-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students-app-resource-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw -B test

  front-end:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: students-app-front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: students-app-front-end/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run build
        env:
          CI: false

